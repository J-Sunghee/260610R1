<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingoStep — AI 영어 표현 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --primary:#5B5FE9;
    --primary-dark:#4347C9;
    --primary-light:#EEEFFD;
    --accent:#00C48C;
    --accent-light:#E2F9F1;
    --warn:#FFB020;
    --warn-light:#FFF4DE;
    --danger:#F0564A;
    --danger-light:#FDEAE8;
    --bg:#F6F7FB;
    --surface:#FFFFFF;
    --text:#1E2235;
    --text-sub:#5A6072;
    --text-faint:#9AA0B0;
    --border:#E7E9F0;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 6px 24px rgba(30,34,53,.07);
    --shadow-sm:0 2px 8px rgba(30,34,53,.06);
    --font:'Inter','Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  textarea,input{font-family:inherit}

  /* ---------- layout ---------- */
  .app{max-width:680px;margin:0 auto;padding:0 16px 64px}
  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(246,247,251,.92);
    backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 2px;margin-bottom:8px;
  }
  .logo{font-weight:800;font-size:1.15rem;color:var(--primary);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
  .topbar-right{display:flex;align-items:center;gap:8px}

  /* ---------- level badges ---------- */
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-weight:700;font-size:.8rem;
    padding:4px 12px;border-radius:999px;color:#fff;
    letter-spacing:.02em;
  }
  .badge.A1{background:#34C77B}
  .badge.A2{background:#0FA968}
  .badge.B1{background:#3B82F6}
  .badge.B2{background:#5B5FE9}
  .badge.C1{background:#8B5CF6}
  .badge.C2{background:#1E2235}

  /* ---------- cards ---------- */
  .card{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px 24px;
    margin-bottom:18px;
    border:1px solid var(--border);
  }
  .card.tight{padding:20px}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-weight:700;font-size:.95rem;
    border-radius:14px;padding:14px 22px;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
    user-select:none;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(91,95,233,.35)}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-primary:disabled{background:#C3C5E8;box-shadow:none;cursor:not-allowed}
  .btn-ghost{background:var(--primary-light);color:var(--primary)}
  .btn-ghost:hover{background:#E1E3FB}
  .btn-outline{background:#fff;color:var(--text-sub);border:1.5px solid var(--border)}
  .btn-outline:hover{border-color:var(--primary);color:var(--primary)}
  .btn-accent{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(0,196,140,.3)}
  .btn-block{width:100%}
  .btn-sm{padding:9px 16px;font-size:.85rem;border-radius:11px}
  .btn-icon{
    width:34px;height:34px;border-radius:50%;
    background:var(--primary-light);color:var(--primary);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:.95rem;flex:none;
    transition:background .12s;
  }
  .btn-icon:hover{background:#E1E3FB}
  .btn-icon.speaking{background:var(--primary);color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(91,95,233,.4)}50%{box-shadow:0 0 0 7px rgba(91,95,233,0)}}

  /* ---------- progress ---------- */
  .progress-wrap{display:flex;align-items:center;gap:12px;margin:6px 0 20px}
  .progress-track{flex:1;height:10px;background:#E7E9F4;border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#8A8DF2);border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1)}
  .progress-label{font-size:.8rem;font-weight:700;color:var(--text-sub);min-width:42px;text-align:right}

  /* ---------- typography ---------- */
  h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.3}
  h2{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
  .sub{color:var(--text-sub);font-size:.95rem}
  .faint{color:var(--text-faint);font-size:.82rem}
  .section-label{
    font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
    color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px;
  }
  .section-label.green{color:var(--accent)}
  .section-label.amber{color:#D98E00}

  .expression-title{
    font-size:2rem;font-weight:800;letter-spacing:-.025em;line-height:1.25;
    color:var(--text);
  }
  .definition{
    font-size:1.05rem;color:var(--text);line-height:1.7;
    background:var(--primary-light);border-radius:var(--radius-sm);
    padding:16px 18px;border-left:4px solid var(--primary);
  }
  .syn-list{display:flex;flex-wrap:wrap;gap:8px}
  .syn-chip{
    background:var(--accent-light);color:#00845F;
    font-weight:600;font-size:.88rem;padding:6px 14px;border-radius:999px;
  }
  .example-row{
    display:flex;align-items:flex-start;gap:10px;
    padding:12px 14px;background:var(--bg);border-radius:var(--radius-sm);
    margin-bottom:10px;font-size:.97rem;
  }
  .example-row .txt{flex:1}
  .divider{height:1px;background:var(--border);margin:24px 0}

  /* ---------- image ---------- */
  .img-box{
    border-radius:var(--radius-sm);overflow:hidden;background:var(--bg);
    min-height:200px;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;text-align:center;padding:0;
  }
  .img-box img{width:100%;display:block}
  .img-caption{
    font-size:.88rem;color:var(--text-sub);font-style:italic;
    text-align:center;margin-top:10px;
  }

  /* ---------- quiz / test options ---------- */
  .option{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:#fff;border:2px solid var(--border);border-radius:14px;
    padding:15px 18px;margin-bottom:10px;font-size:.98rem;font-weight:500;
    transition:all .14s ease;color:var(--text);
  }
  .option:hover{border-color:#B9BCF5;background:#FBFBFF}
  .option .key{
    width:28px;height:28px;border-radius:9px;flex:none;
    background:var(--bg);color:var(--text-sub);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:.8rem;font-weight:800;
  }
  .option.selected{border-color:var(--primary);background:var(--primary-light)}
  .option.selected .key{background:var(--primary);color:#fff}
  .option.correct{border-color:var(--accent);background:var(--accent-light)}
  .option.correct .key{background:var(--accent);color:#fff}
  .option.wrong{border-color:var(--danger);background:var(--danger-light)}
  .option.wrong .key{background:var(--danger);color:#fff}
  .option:disabled{cursor:default;opacity:1}

  .quiz-sentence{
    font-size:1.1rem;line-height:1.8;font-weight:500;
    background:var(--bg);border-radius:var(--radius-sm);padding:18px;margin-bottom:18px;
  }
  .blank{
    display:inline-block;min-width:90px;border-bottom:2.5px solid var(--primary);
    color:var(--primary);font-weight:800;text-align:center;padding:0 6px;
  }

  /* ---------- feedback boxes ---------- */
  .feedback-box{
    border-radius:var(--radius-sm);padding:16px 18px;margin-top:14px;
    font-size:.93rem;line-height:1.7;
  }
  .feedback-box.good{background:var(--accent-light);border-left:4px solid var(--accent)}
  .feedback-box.info{background:var(--warn-light);border-left:4px solid var(--warn)}
  .feedback-box h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  .feedback-box.good h4{color:#00845F}
  .feedback-box.info h4{color:#C07F00}

  textarea.writing{
    width:100%;border:2px solid var(--border);border-radius:var(--radius-sm);
    padding:14px;font-size:.97rem;resize:vertical;min-height:84px;
    outline:none;transition:border-color .14s;background:#fff;color:var(--text);
  }
  textarea.writing:focus{border-color:var(--primary)}
  input.keyfield{
    width:100%;border:2px solid var(--border);border-radius:var(--radius-sm);
    padding:14px 16px;font-size:.97rem;outline:none;background:#fff;color:var(--text);
  }
  input.keyfield:focus{border-color:var(--primary)}

  /* ---------- spinner / states ---------- */
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:4px solid var(--primary-light);border-top-color:var(--primary);
    animation:spin .8s linear infinite;
  }
  .spinner.sm{width:18px;height:18px;border-width:3px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center-state{display:flex;flex-direction:column;align-items:center;gap:16px;padding:48px 16px;text-align:center}

  .error-box{
    background:var(--danger-light);border:1.5px solid #F4B6B0;
    border-radius:var(--radius-sm);padding:18px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:12px;
  }
  .error-box p{color:#B03A30;font-size:.92rem;font-weight:500}

  /* ---------- review list ---------- */
  .review-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 16px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:8px;
  }
  .review-item .name{font-weight:700;font-size:.97rem}
  .review-item .meta{font-size:.78rem;color:var(--text-faint)}
  .pill-due{background:var(--warn-light);color:#C07F00;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:99px}

  /* ---------- step dots ---------- */
  .step-dots{display:flex;gap:7px;justify-content:center;margin:14px 0 4px}
  .step-dots .d{width:9px;height:9px;border-radius:50%;background:#D8DAE8;transition:all .2s}
  .step-dots .d.on{background:var(--primary);transform:scale(1.25)}
  .step-dots .d.done{background:var(--accent)}

  /* ---------- card slide animation ---------- */
  .slide-in{animation:slideIn .35s cubic-bezier(.3,.7,.3,1)}
  @keyframes slideIn{from{opacity:0;transform:translateX(38px)}to{opacity:1;transform:translateX(0)}}
  .fade-in{animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- hero ---------- */
  .hero{
    text-align:center;padding:42px 20px 36px;
    background:linear-gradient(150deg,var(--primary) 0%,#7E6FF0 60%,#9D8DF5 100%);
    border-radius:22px;color:#fff;margin-bottom:20px;
    box-shadow:0 12px 32px rgba(91,95,233,.35);
  }
  .hero h1{color:#fff;margin-bottom:8px}
  .hero p{opacity:.85;font-size:.95rem}
  .hero .big-emoji{font-size:2.6rem;display:block;margin-bottom:10px}

  .score-ring{
    width:120px;height:120px;border-radius:50%;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.9rem;font-weight:800;color:var(--primary);
    background:conic-gradient(var(--primary) var(--deg,0deg), #E7E9F4 0deg);
    position:relative;
  }
  .score-ring::before{content:'';position:absolute;inset:10px;background:#fff;border-radius:50%}
  .score-ring span{position:relative}

  .home-actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .stat-row{display:flex;gap:12px;margin-bottom:18px}
  .stat{
    flex:1;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:14px;text-align:center;box-shadow:var(--shadow-sm);
  }
  .stat .num{font-size:1.4rem;font-weight:800;color:var(--primary)}
  .stat .lbl{font-size:.74rem;color:var(--text-faint);font-weight:600}

  @media (max-width:480px){
    .card{padding:22px 18px}
    .expression-title{font-size:1.6rem}
    h1{font-size:1.45rem}
    .hero{padding:34px 16px 30px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none">
    <div class="logo"><span class="dot"></span>LingoStep</div>
    <div class="topbar-right" id="topbarRight"></div>
  </div>
  <main id="view"></main>
</div>

<script>
'use strict';

/* =====================================================
   Constants & storage
===================================================== */
const APP_VERSION = 'v3';
const TEXT_MODELS  = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-flash-latest'];
const IMAGE_MODELS = ['gemini-2.5-flash-image', 'gemini-2.5-flash-image-preview'];
const API_BASE    = 'https://generativelanguage.googleapis.com/v1beta/models/';

const LS = {
  key:    'lingostep_api_key',
  level:  'lingostep_level',
  reviews:'lingostep_reviews',   // [{expression, definition, synonyms, examples, level, stage, due}]
};
const REVIEW_INTERVALS = [1, 3, 7, 16, 35]; // days, spaced repetition

const store = {
  get apiKey(){ return localStorage.getItem(LS.key) || ''; },
  set apiKey(v){ localStorage.setItem(LS.key, v); },
  get level(){ return localStorage.getItem(LS.level) || ''; },
  set level(v){ localStorage.setItem(LS.level, v); },
  get reviews(){ try { return JSON.parse(localStorage.getItem(LS.reviews)) || []; } catch(e){ return []; } },
  set reviews(v){ localStorage.setItem(LS.reviews, JSON.stringify(v)); },
};

const todayStr = () => new Date().toISOString().slice(0,10);
const addDays = (dateStr, n) => {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
};
const dueReviews = () => store.reviews.filter(r => r.due <= todayStr());

const esc = s => String(s ?? '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

/* =====================================================
   Gemini API helpers
===================================================== */
// Tries each candidate model in order; remembers the first one that works.
let workingTextModel = null;
let workingImageModel = null;

async function callGemini(models, remembered, body){
  const candidates = remembered ? [remembered, ...models.filter(m => m !== remembered)] : models;
  let lastErr = null;
  for(const model of candidates){
    const res = await fetch(API_BASE + model + ':generateContent', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key': store.apiKey },
      body: JSON.stringify(body),
    });
    if(res.ok) return { model, data: await res.json() };
    const text = await res.text().catch(()=> '');
    lastErr = new Error('API ' + res.status + ' (' + model + ')' + (text ? ': ' + text.slice(0,160) : ''));
    // 404 = model name not available for this key → try the next candidate
    if(res.status !== 404) throw lastErr;
  }
  throw lastErr;
}

async function geminiText(prompt, asJson = true){
  const { model, data } = await callGemini(TEXT_MODELS, workingTextModel, {
    contents:[{ parts:[{ text: prompt }] }],
    generationConfig: asJson ? { responseMimeType:'application/json' } : {},
  });
  workingTextModel = model;
  const text = (data.candidates?.[0]?.content?.parts || [])
    .map(p => p.text || '').join('').trim();
  if(!text) throw new Error('Empty response from model');
  if(!asJson) return text;
  // strip possible code fences before parsing
  const clean = text.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  return JSON.parse(clean);
}

async function geminiImage(prompt){
  const { model, data } = await callGemini(IMAGE_MODELS, workingImageModel, {
    contents:[{ parts:[{ text: prompt }] }],
    generationConfig:{ responseModalities:['TEXT','IMAGE'] },
  });
  workingImageModel = model;
  const part = (data.candidates?.[0]?.content?.parts || []).find(p => p.inlineData);
  if(!part) throw new Error('No image returned');
  return 'data:' + (part.inlineData.mimeType || 'image/png') + ';base64,' + part.inlineData.data;
}

/* =====================================================
   Text-to-speech (Web Speech API)
===================================================== */
let voicesReady = [];
function loadVoices(){ voicesReady = speechSynthesis.getVoices(); }
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, btn){
  if(!('speechSynthesis' in window)) return alert('이 브라우저는 음성 합성을 지원하지 않습니다.');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.95;
  const v = voicesReady.find(v => v.lang === 'en-US') || voicesReady.find(v => v.lang.startsWith('en'));
  if(v) u.voice = v;
  if(btn){
    document.querySelectorAll('.btn-icon.speaking').forEach(b => b.classList.remove('speaking'));
    btn.classList.add('speaking');
    u.onend = u.onerror = () => btn.classList.remove('speaking');
  }
  speechSynthesis.speak(u);
}
function ttsBtn(text){
  return `<button class="btn-icon" title="발음 듣기" onclick="speak(${JSON.stringify(text).replace(/"/g,'&quot;')}, this)">&#128264;</button>`;
}

/* =====================================================
   Level test (hard-coded, progressive difficulty)
===================================================== */
const LEVEL_TEST = [
  { level:'A1', q:'I ___ a student.',
    options:['am','is','are','be'], answer:0 },
  { level:'A2', q:'Yesterday, we ___ a really good movie at home.',
    options:['watch','watched','watching','watches'], answer:1 },
  { level:'B1', q:'The meeting was ___ because the manager was sick.',
    options:['called off','put up','taken after','made out'], answer:0 },
  { level:'B2', q:'If I ___ about the traffic, I would have left home earlier.',
    options:['knew','have known','had known','would know'], answer:2 },
  { level:'C1', q:'Her argument was so ___ that even her harshest critics were persuaded.',
    options:['redundant','compelling','superficial','tentative'], answer:1 },
  { level:'C2', q:'Scarcely ___ the door when the phone rang.',
    options:['he had opened','did he opened','he opened','had he opened'], answer:3 },
];
const LEVELS = ['A1','A2','B1','B2','C1','C2'];
const scoreToLevel = score => LEVELS[Math.max(0, Math.min(5, score - 1))];

/* =====================================================
   App state
===================================================== */
const state = {
  test:    { idx:0, score:0 },
  session: null,   // { expressions:[...], quiz:[...], idx, quizIdx, quizScore, answers:[] }
  imageCache: {},  // expression -> dataURL
};

const view = document.getElementById('view');
const topbar = document.getElementById('topbar');
const topbarRight = document.getElementById('topbarRight');

function renderTopbar(){
  const lv = store.level;
  topbar.style.display = 'flex';
  topbarRight.innerHTML = `<span class="faint" style="margin-right:4px">${APP_VERSION}</span>` +
    (lv ? `<span class="badge ${lv}">&#9733; ${lv}</span>` : '');
}

/* =====================================================
   Screen: API key
===================================================== */
function showKeyScreen(){
  renderTopbar();
  view.innerHTML = `
  <div class="fade-in">
    <div class="hero">
      <span class="big-emoji">&#127891;</span>
      <h1>LingoStep에 오신 것을 환영해요</h1>
      <p>내 레벨에 딱 맞는 영어 표현을 AI와 함께 배워요</p>
    </div>
    <div class="card">
      <div class="section-label">시작하기</div>
      <h2 style="margin-bottom:8px">Gemini API 키를 입력하세요</h2>
      <p class="sub" style="margin-bottom:16px">
        학습 콘텐츠와 이미지를 생성하기 위해 Google Gemini API 키가 필요합니다.
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--primary);font-weight:600">키 발급받기 &rarr;</a>
      </p>
      <input class="keyfield" id="apiKeyInput" type="password" placeholder="AIza..." autocomplete="off">
      <p class="faint" style="margin:10px 0 18px">&#128274; 키는 이 브라우저에만 저장됩니다. 외부 서버로 전송되지 않아요.</p>
      <button class="btn btn-primary btn-block" onclick="saveKey()">학습 시작하기</button>
    </div>
  </div>`;
  const input = document.getElementById('apiKeyInput');
  input.addEventListener('keydown', e => { if(e.key === 'Enter') saveKey(); });
  input.focus();
}
function saveKey(){
  const v = document.getElementById('apiKeyInput').value.trim();
  if(!v) return alert('API 키를 입력해 주세요.');
  store.apiKey = v;
  route();
}

/* =====================================================
   Screen: Level test
===================================================== */
function showLevelTest(){
  state.test = { idx:0, score:0 };
  renderTestQuestion();
}
function renderTestQuestion(){
  renderTopbar();
  const { idx } = state.test;
  const q = LEVEL_TEST[idx];
  const pct = Math.round(idx / LEVEL_TEST.length * 100);
  view.innerHTML = `
  <div class="slide-in">
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

        <button class="option" onclick="answerTest(${i}, this)">

        </button>`).join('')}

  </div>`;
}
function answerTest(i, btn){
  const q = LEVEL_TEST[state.test.idx];
  document.querySelectorAll('.option').forEach(b => b.disabled = true);
  btn.classList.add(i === q.answer ? 'correct' : 'wrong');
  if(i === q.answer) state.test.score++;
  else document.querySelectorAll('.option')[q.answer].classList.add('correct');
  setTimeout(() => {
    state.test.idx++;
    if(state.test.idx < LEVEL_TEST.length) renderTestQuestion();
    else finishTest();
  }, 750);
}
function finishTest(){
  const level = scoreToLevel(state.test.score);
  store.level = level;
  renderTopbar();

function gradeReview(remembered){
  const { items, idx } = state.review;
  const item = items[idx];
  const all = store.reviews;
  const target = all.find(r => r.expression === item.expression);
  if(target){
    target.stage = remembered ? Math.min(target.stage + 1, REVIEW_INTERVALS.length - 1) : 0;
    target.due = addDays(todayStr(), REVIEW_INTERVALS[target.stage]);
    store.reviews = all;

  state.review.idx++;
  if(state.review.idx < items.length) renderReviewCard();
  else {

/* =====================================================
   Learning session: content generation
===================================================== */
function buildContentPrompt(level){
  const known = store.reviews.map(r => r.expression).slice(-40);
  return `You are an expert English curriculum designer.
Create a lesson for a Korean learner of English at CEFR level ${level}.

Pick exactly 5 useful English expressions (words, phrases, phrasal verbs, or idioms) appropriate for CEFR ${level}.
${known.length ? 'Do NOT use any of these already-learned expressions: ' + known.join(', ') + '.' : ''}

Return ONLY valid JSON matching this exact shape:
{
  "expressions": [
    {
      "expression": "the expression",
      "definition": "A Collins COBUILD style full-sentence definition. Write it as a complete sentence that shows the expression in use, e.g. 'If you put off doing something, you delay doing it.' Use vocabulary a ${level} learner can understand.",
      "synonyms": ["3 to 5 synonyms or near-synonyms, English only, Longman thesaurus style"],
      "examples": ["basic example sentence 1", "basic example sentence 2"],
      "applied_examples": ["a practical sentence a learner could adapt to daily life 1", "another practical, personal-context sentence 2"],
      "image_prompt": "a vivid, concrete scene description (in English) for an illustration that visually depicts the meaning of this expression, friendly flat illustration style, no text in image",
      "image_caption": "one short English sentence using the expression that describes the illustrated scene"
    }
  ],
  "quiz": [
    {
      "sentence": "a NEW sentence (not one of the examples) with the target expression replaced by ____",
      "answer": "the exact expression that fills the blank",
      "options": ["4 options including the answer; the other 3 are the other lesson expressions or plausible distractors"]
    }
  ]
}

Rules:
- "quiz" must contain exactly 5 items, one per expression, in random order.
- Each quiz "answer" must exactly match one of its "options".
- All learning content must be in English only. Difficulty must fit CEFR ${level}.`;
}

async function startSession(){
  renderTopbar();
  view.innerHTML = `
  <div class="center-state fade-in">
    <div class="spinner"></div>
    <h2>레벨 ${store.level} 맞춤 표현을 만들고 있어요…</h2>
    <p class="sub">AI가 정의, 동의어, 예문, 퀴즈를 준비 중입니다 (10초 내외)</p>
  </div>`;
  try {
    const data = await geminiText(buildContentPrompt(store.level));
    if(!data.expressions || data.expressions.length < 5 || !data.quiz || data.quiz.length < 5)
      throw new Error('Incomplete lesson data');
    state.session = {
      expressions: data.expressions.slice(0,5),
      quiz: data.quiz.slice(0,5),
      idx: 0, quizIdx: 0, quizScore: 0, answers: [],
    };
    renderExpressionCard();
  } catch(err){
    showError('학습 콘텐츠 생성에 실패했어요.', err, 'startSession()');
  }
}

async function loadCardImage(e){
  const box = document.getElementById('imgBox');
  const cap = document.getElementById('imgCaption');
  if(!box) return;
  if(state.imageCache[e.expression]){
    box.innerHTML = `<img src="${state.imageCache[e.expression]}" alt="${esc(e.expression)}">`;
    cap.textContent = e.image_caption || '';
    return;
  }
  box.innerHTML = `<div class="spinner"></div><p class="faint">이미지를 생성하고 있어요…</p>`;
  cap.textContent = '';
  try {
    const url = await geminiImage(
      (e.image_prompt || ('An illustration of: ' + e.expression)) +
      ' — bright friendly flat vector illustration, soft colors, no text or letters in the image.');
    state.imageCache[e.expression] = url;
    // user may have moved on; only render if still on the same card
    const cur = state.session?.expressions[state.session.idx];
    if(cur && cur.expression === e.expression && document.getElementById('imgBox')){
      document.getElementById('imgBox').innerHTML = `<img src="${url}" alt="${esc(e.expression)}">`;
      document.getElementById('imgCaption').textContent = e.image_caption || '';
    }
  } catch(err){
    if(document.getElementById('imgBox') === box){
      box.innerHTML = `
        <p class="faint" style="padding:0 16px">이미지 생성 실패: ${esc(err.message)}</p>
        <button class="btn btn-ghost btn-sm" onclick='retryImage()'>이미지 다시 생성</button>
        <div style="height:14px"></div>`;
    }
  }
}

  loadCardImage(e);
}

        <button class="option" onclick="answerQuiz(${i}, this)">
          <span class="key">${'ABCD'[i] || i+1}</span><span>${esc(o)}</span>
        </button>`).join('')}
      <div id="quizExplain"></div>
      <div id="quizNextWrap"></div>
    </div>
  </div>`;

async function answerQuiz(i, btn){
  const s = state.session;
  const q = s.quiz[s.quizIdx];
  const chosen = q.options[i];
  const correct = chosen.trim().toLowerCase() === q.answer.trim().toLowerCase();
  document.querySelectorAll('.option').forEach(b => b.disabled = true);
  btn.classList.add(correct ? 'correct' : 'wrong');
  if(!correct){
    const idx = q.options.findIndex(o => o.trim().toLowerCase() === q.answer.trim().toLowerCase());
    if(idx >= 0) document.querySelectorAll('.option')[idx].classList.add('correct');
  }
  if(correct) s.quizScore++;
  s.answers.push({ q, chosen, correct });

  const nextWrap = document.getElementById('quizNextWrap');
  nextWrap.innerHTML = `
    <button class="btn btn-primary btn-block" style="margin-top:14px" onclick="nextQuiz()">
      ${s.quizIdx < 4 ? '다음 문제 &rarr;' : '결과 보기 &rarr;'}
    </button>`;

  if(!correct){
    const exp = document.getElementById('quizExplain');
    exp.innerHTML = `
      <div class="feedback-box info fade-in" id="explainBox">
        <h4>Why is it wrong?</h4>
        <p style="display:flex;align-items:center;gap:8px"><span class="spinner sm"></span> AI가 해설을 준비하고 있어요…</p>
      </div>`;
    try {
      const ex = await geminiText(
`A CEFR ${store.level} English learner answered a fill-in-the-blank quiz.
Sentence: "${q.sentence}"
Correct answer: "${q.answer}"
Learner chose: "${chosen}"

In ENGLISH ONLY, using simple vocabulary suitable for a ${store.level} learner, explain in 2-3 short sentences:
1) why "${chosen}" does not fit, and
2) why "${q.answer}" is correct (meaning difference).
Return ONLY JSON: { "explanation": "..." }`);
      const box = document.getElementById('explainBox');
      if(box) box.innerHTML = `<h4>Why is it wrong?</h4><p>${esc(ex.explanation)}</p>`;
    } catch(err){
      const box = document.getElementById('explainBox');
      if(box) box.innerHTML = `<h4>Why is it wrong?</h4>
        <p>해설을 가져오지 못했어요. (${esc(err.message)})</p>
        <p style="margin-top:6px"><strong>Answer:</strong> ${esc(q.answer)}</p>`;
    }
  }
}

function nextQuiz(){
  const s = state.session;
  s.quizIdx++;
  if(s.quizIdx < s.quiz.length) renderQuizQuestion();
  else finishSession();
}

/* =====================================================
   Session complete → save to spaced repetition
===================================================== */
function finishSession(){
  const s = state.session;
  // record learned expressions for spaced repetition
  const all = store.reviews;
  const today = todayStr();
  s.expressions.forEach(e => {
    const existing = all.find(r => r.expression.toLowerCase() === e.expression.toLowerCase());
    if(existing){
      existing.stage = 0;
      existing.due = addDays(today, REVIEW_INTERVALS[0]);
    } else {
      all.push({
        expression: e.expression,
        definition: e.definition,
        synonyms: e.synonyms || [],
        examples: e.examples || [],
        level: store.level,
        learnedAt: today,
        stage: 0,
        due: addDays(today, REVIEW_INTERVALS[0]),
      });
    }
  });
  store.reviews = all;

  const score = s.quizScore;
  const deg = score / 5 * 360;
  renderTopbar();
  view.innerHTML = `
  <div class="fade-in">
    <div class="hero">
      <span class="big-emoji">${score === 5 ? '&#127942;' : score >= 3 ? '&#127881;' : '&#128170;'}</span>
      <h1>오늘 학습 완료!</h1>
      <p>표현 5개 학습 + 퀴즈를 마쳤어요</p>
    </div>
    <div class="card" style="text-align:center">
      <div class="score-ring" style="--deg:${deg}deg"><span>${score}/5</span></div>
      <h2 style="margin-bottom:6px">${score === 5 ? 'Perfect!' : score >= 3 ? 'Well done!' : 'Keep going!'}</h2>
      <p class="sub" style="margin-bottom:6px">오늘 배운 표현은 내일 복습 목록에 올라가요.</p>
      <p class="faint" style="margin-bottom:20px">간격 반복: 1일 &rarr; 3일 &rarr; 7일 &rarr; 16일 &rarr; 35일</p>
      <div class="home-actions">
        <button class="btn btn-primary btn-block" onclick="startSession()">새 표현 5개 더 학습하기</button>
        <button class="btn btn-outline btn-block" onclick="showHome()">홈으로</button>
      </div>
    </div>
  </div>`;
  state.session = null;
}

/* =====================================================
   Router
===================================================== */
function route(){
  if(!store.apiKey) return showKeyScreen();
  if(!store.level)  return showLevelTest();
  showHome();
}
route();
</script>
</body>
</html>
